xt><g opacity="0"><rect x="210" y="245" width="260" height="10" rx="2" fill="#21262d"/><rect x="210" y="245" width="0" height="10" rx="2" fill="#3fb950"><animate attributeName="width" from="0" to="252" begin="5.3s" dur="1.1s" fill="freeze"/></rect><set attributeName="opacity" to="1" begin="5.2s" fill="freeze"/></g><text x="488" y="256" opacity="0"><tspan fill="#8b949e">accuracy </tspan><tspan fill="#3fb950" font-weight="700">97%</tspan><set attributeName="opacity" to="1" begin="6.450000000000001s" fill="freeze"/></text><text x="26" y="282" xml:space="preserve" opacity="0"><tspan fill="#f0883e">[track] </tspan><tspan fill="#c9d1d9">over/under-marking, run-to-run variance</tspan><set attributeName="opacity" to="1" begin="6.7s" fill="freeze"/></text><text x="26" y="334" clip-path="url(#c10)"><tspan fill="#3fb950">$ </tspan><tspan fill="#c9d1d9">cat now.txt</tspan></text><text x="26" y="360" xml:space="preserve" opacity="0"><tspan fill="#3fb950">> </tspan><tspan fill="#c9d1d9">LLM grading and speech-to-text for PrepAI</tspan><set attributeName="opacity" to="1" begin="7.8s" fill="freeze"/></text><text x="26" y="386" xml:space="preserve" opacity="0"><tspan fill="#3fb950">> </tspan><tspan fill="#c9d1d9">RAG, LangGraph agents and computer vision on the side</tspan><set attributeName="opacity" to="1" begin="8.0s" fill="freeze"/></text><g opacity="0"><text x="26" y="412" fill="#3fb950">$</text><rect x="44" y="398" width="9" height="18" fill="#c9d1d9"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/></rect><set attributeName="opacity" to="1" begin="8.3s" fill="freeze"/></g></g>
